name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (CPU-only PyTorch, so CI doesn't download GBs of CUDA libraries)
        run: |
          uv venv --python 3.12
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run --no-sync ruff check src tests bench
      - name: Tests (tiny float64 model on CPU; GPU tests are skipped)
        run: uv run --no-sync python -m pytest -q
