[project]
name = "miniserve"
version = "0.5.0"
description = "A small LLM inference server built from scratch: continuous batching, a paged KV cache, prefix caching, chunked prefill, speculative decoding and an OpenAI-compatible streaming API."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ahraz Kibria" }]
dependencies = [
    "torch>=2.5",
    "transformers>=4.51",
    "safetensors",
    "tokenizers",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "numpy",
    "httpx>=0.27",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "mypy",
    "openai>=1.30",
    "matplotlib",
]

[project.scripts]
miniserve = "miniserve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "gpu: needs a CUDA GPU and the real Qwen3-0.6B weights (run locally with -m gpu)",
]
addopts = "-ra -m 'not gpu'"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/miniserve"]
